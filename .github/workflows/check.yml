name: Flight price check

on:
  # Triggered by cron-job.org via workflow_dispatch on a 30-min schedule.
  # GitHub's native schedule trigger is intentionally not used — it was
  # unreliable (multi-hour delays on free public repos).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: flight-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.59.0

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run price check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Per-trip thresholds live in check.py. Set THRESHOLD_DKK here
          # only to force a global override (e.g. "100000" to test email).
        run: python check.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "state: update flight prices"
            # Pull-rebase in case parallel runs raced (concurrency guards
            # against this, but be defensive).
            git pull --rebase --autostash || true
            git push
          fi
